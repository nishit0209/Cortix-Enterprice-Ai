  # ------------------------------------------------------------------ row-policy escapes (policy north_only)
  - id: rowpol-001
    category: row_policy
    policy: north_only
    sql: SELECT region, sum(revenue) AS revenue FROM sales GROUP BY region
    expect: neutralized
    checks:
      params_contain: [North]
  - id: rowpol-002
    category: row_policy
    policy: north_only
    sql: SELECT region FROM sales WHERE region = 'South' OR 1=1
    expect: neutralized
    checks:
      params_contain: [North]
  - id: rowpol-003
    category: row_policy
    policy: north_only
    sql: SELECT region FROM sales UNION ALL SELECT region FROM sales
    expect: neutralized
  - id: rowpol-004
    category: row_policy
    policy: north_only
    sql: SELECT (SELECT max(revenue) FROM sales) AS top_revenue
    expect: neutralized
  - id: rowpol-005
    category: row_policy
    policy: north_only
    sql: SELECT s1.region, x.revenue FROM sales s1 CROSS JOIN LATERAL (SELECT s2.revenue FROM sales s2 WHERE s2.order_id = s1.order_id) x
    expect: safe
  - id: rowpol-006
