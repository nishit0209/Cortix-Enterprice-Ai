    policy: north_only
    sql: WITH sales AS (SELECT * FROM sales) SELECT * FROM sales
    expect: reject
    codes: [forbidden_clause, table_not_allowed, invalid_sql]
    note: SECURITY_ARCHITECTURE 5.1 step 7 rejects CTE names that shadow a policy table
  - id: rowpol-007
    category: row_policy
    policy: north_only
    sql: SELECT a.region, b.revenue FROM sales a JOIN sales b ON a.order_id = b.order_id
    expect: neutralized
  - id: rowpol-008
