  # ------------------------------------------------------------------ denial of service
  - id: dos-001
    category: dos
    sql: WITH RECURSIVE r(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r) SELECT n FROM r
    expect: reject
    codes: [forbidden_construct]
  - id: dos-002
    category: dos
    sql: SELECT count(*) FROM sales a, sales b, sales c, sales d, sales e, sales f
    expect: reject
    codes: [cost_exceeded]
    stage: execute
  - id: dos-003
    category: dos
    generate: {kind: nested_subqueries, depth: 20}
    expect: reject
    codes: [too_large]
  - id: dos-004
    category: dos
    generate: {kind: in_list, size: 10000}
    expect: reject
    codes: [too_large]
  - id: dos-005
    category: dos
    generate: {kind: long_text, bytes: 12000}
    expect: reject
    codes: [too_large]
  - id: dos-006
    category: dos
    sql: SELECT count(*) FROM sales a CROSS JOIN sales b CROSS JOIN sales c CROSS JOIN customers d
    expect: reject
    codes: [cost_exceeded]
