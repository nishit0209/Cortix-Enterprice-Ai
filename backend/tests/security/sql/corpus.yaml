    expect: neutralized

  # ------------------------------------------------------------------ deny-all / allow-all row predicates (W2)
  # governance.effective_policy emits RowPredicate((col, "in", ())) for "no rows" and ("not_in", ()) for "all
  # rows". `IN ()` is a syntax error in Postgres, so the guard must render FALSE / TRUE (CONTRACT W1 as-built).
  - id: deny-001
    category: deny_all_predicate
    policy: deny_all
    sql: SELECT region, sum(revenue) AS revenue FROM sales GROUP BY region
    expect: neutralized
    checks:
      contains_ci: ["false"]
      not_contains_ci: ["in ()", "in()"]
  - id: deny-002
    category: deny_all_predicate
    policy: deny_all
    sql: SELECT count(*) AS n FROM sales
    expect: neutralized
    checks:
      contains_ci: ["false"]
  - id: deny-003
    category: deny_all_predicate
    policy: deny_all
    sql: SELECT region FROM sales WHERE region = 'North' OR TRUE
    expect: neutralized
    checks:
      contains_ci: ["false"]
  - id: deny-004
    category: deny_all_predicate
    policy: deny_all
    sql: SELECT c.customer_name FROM customers c WHERE c.customer_id IN (SELECT customer_id FROM sales)
    expect: neutralized
    checks:
      contains_ci: ["false"]
  - id: deny-005
    category: deny_all_predicate
    policy: deny_all
    sql: SELECT region FROM sales UNION ALL SELECT city FROM customers
    expect: neutralized
    checks:
      contains_ci: ["false"]
  - id: deny-006
    category: deny_all_predicate
    policy: allow_all_notin
    sql: SELECT region, count(*) AS n FROM sales GROUP BY region
    expect: neutralized
    checks:
      not_contains_ci: ["not in ()", "in ()", "in()"]

  # ------------------------------------------------------------------ mask bypass (policy masked_multi)
  # phone = mask_partial, customer_name = mask_hash, city = mask_null. Masking happens at the source, so the
  # raw value must never be readable through whole-row functions, star expansion, ORDER BY, WHERE or joins.
  - id: mask-001
    category: mask_bypass
    policy: masked_multi
    sql: SELECT row_to_json(c) FROM customers c
    expect: reject
    codes: [column_not_allowed, forbidden_function, unknown_column]
  - id: mask-002
    category: mask_bypass
    policy: masked_multi
    sql: SELECT c.* FROM customers c
    expect: neutralized
    checks:
      contains_ci: ["repeat(", "sha256"]
  - id: mask-003
    category: mask_bypass
    policy: masked_multi
    sql: SELECT customer_id FROM customers ORDER BY phone
    expect: neutralized
    note: the ORDER BY must see the masked value (ordering by the raw phone leaks it one comparison at a time)
  - id: mask-004
    category: mask_bypass
    policy: masked_multi
    sql: SELECT customer_id FROM customers WHERE phone = '9800000001'
    expect: neutralized
  - id: mask-005
    category: mask_bypass
    policy: masked_multi
    sql: SELECT to_jsonb(customers) FROM customers
    expect: reject
    codes: [column_not_allowed, forbidden_function, unknown_column]
  - id: mask-006
    category: mask_bypass
    policy: masked_multi
    sql: SELECT json_agg(c) FROM customers c
    expect: reject
    codes: [column_not_allowed, forbidden_function, unknown_column]
  - id: mask-007
    category: mask_bypass
    policy: masked_multi
    sql: SELECT segment, min(phone) AS p FROM customers GROUP BY segment ORDER BY min(phone)
    expect: neutralized
  - id: mask-008
    category: mask_bypass
    policy: masked_multi
    sql: SELECT * FROM customers
    expect: neutralized
    checks:
      contains_ci: ["repeat(", "sha256"]
  - id: mask-009
    category: mask_bypass
    policy: masked_multi
    sql: SELECT customer_id, length(phone) AS n FROM customers
    expect: neutralized
  - id: mask-010
    category: mask_bypass
    policy: masked_multi
    sql: SELECT c.customer_id FROM customers c JOIN customers d ON d.phone = c.phone AND d.customer_id <> c.customer_id
    expect: neutralized
  - id: mask-011
    category: mask_bypass
    policy: masked_multi
    sql: SELECT (c).phone FROM customers c
    expect: reject
    codes: [column_not_allowed, unknown_column, forbidden_clause, parse_error]
  - id: mask-012
    category: mask_bypass
    policy: masked_multi
    sql: SELECT customer_id FROM customers WHERE city IS NOT NULL
    expect: neutralized
    note: city is mask_null at the source, so this predicate can never reveal which customers have a city

  # ------------------------------------------------------------------ CTE shadowing a logical table name
  - id: cte-001
    category: cte_shadowing
    sql: WITH customers AS (SELECT * FROM org_b.ds_7) SELECT * FROM customers
    expect: reject
    codes: [table_not_allowed, unknown_table, forbidden_clause]
  - id: cte-002
    category: cte_shadowing
    policy: north_only
    sql: WITH sales AS (SELECT region, revenue FROM sales) SELECT region, sum(revenue) AS r FROM sales GROUP BY region
    expect: reject
    codes: [forbidden_clause, table_not_allowed, invalid_sql]
    note: SECURITY_ARCHITECTURE 5.1 step 7 rejects CTE names that shadow a policy table
  - id: cte-003
    category: cte_shadowing
    sql: WITH customers AS (SELECT customer_id, 'x@example.test' AS email FROM customers) SELECT email FROM customers
    expect: reject
    codes: [forbidden_clause, table_not_allowed, column_not_allowed, unknown_column, invalid_sql]
  - id: cte-004
    category: cte_shadowing
    policy: masked_multi
    sql: WITH customers AS (SELECT customer_id, phone FROM customers) SELECT phone FROM customers
    expect: reject
    codes: [forbidden_clause, table_not_allowed, invalid_sql]
    note: SECURITY_ARCHITECTURE 5.1 step 7 rejects CTE names that shadow a policy table
  - id: cte-005
    category: cte_shadowing
    sql: WITH "Sales" AS (SELECT usename FROM pg_user) SELECT * FROM "Sales"
    expect: reject
    codes: [system_object]
  - id: cte-006
    category: cte_shadowing
    policy: north_only
    sql: WITH x AS (SELECT * FROM sales), sales AS (SELECT * FROM x) SELECT region FROM sales
    expect: reject
    codes: [forbidden_clause, table_not_allowed, invalid_sql]
    note: SECURITY_ARCHITECTURE 5.1 step 7 rejects CTE names that shadow a policy table

  # ------------------------------------------------------------------ set-operation smuggling
  - id: setop-001
    category: set_operation
    sql: SELECT region FROM sales UNION SELECT email FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column]
  - id: setop-002
    category: set_operation
    sql: SELECT customer_name FROM customers EXCEPT SELECT pan_number FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column]
  - id: setop-003
    category: set_operation
    sql: SELECT city FROM customers INTERSECT SELECT phone FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column]
  - id: setop-004
    category: set_operation
    sql: SELECT region FROM sales UNION ALL SELECT rolname FROM pg_roles
    expect: reject
    codes: [system_object]
  - id: setop-005
    category: set_operation
    sql: SELECT region FROM sales UNION ALL SELECT region FROM org_b.ds_1
    expect: reject
    codes: [table_not_allowed, unknown_table]
  - id: setop-006
    category: set_operation
    policy: north_only
    sql: SELECT region FROM sales WHERE region = 'North' UNION ALL SELECT region FROM sales WHERE region <> 'North'
    expect: neutralized
    checks:
      params_contain: [North]
  - id: setop-007
    category: set_operation
    policy: north_only
    sql: (SELECT region FROM sales LIMIT 1) UNION (SELECT region FROM (SELECT region FROM sales) s)
    expect: neutralized
  - id: setop-008
    category: set_operation
    sql: SELECT region FROM sales UNION ALL SELECT region FROM sales; SELECT 1
    expect: reject
    codes: [multiple_statements]
  - id: setop-009
    category: set_operation
    policy: masked_multi
    sql: SELECT customer_id::text AS v FROM customers UNION ALL SELECT phone FROM customers
    expect: safe
    note: if accepted, the second branch must read the masked phone

  # ------------------------------------------------------------------ unicode-escaped identifiers
  - id: uni-001
    category: unicode_identifiers
    sql: |-
      SELECT U&"\0065mail" FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column, parse_error]
  - id: uni-002
    category: unicode_identifiers
    sql: |-
      SELECT U&"!0065mail" UESCAPE '!' FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column, parse_error]
  - id: uni-003
    category: unicode_identifiers
    sql: |-
      SELECT * FROM U&"\0070g_shadow"
    expect: reject
    codes: [system_object, table_not_allowed, unknown_table, parse_error]
  - id: uni-004
    category: unicode_identifiers
    sql: SELECT "еmail" FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column, parse_error]
    note: Cyrillic U+0435 homoglyph of "e"
  - id: uni-005
    category: unicode_identifiers
    sql: SELECT ｅmail FROM customers
    expect: reject
    codes: [column_not_allowed, unknown_column, parse_error]
    note: fullwidth U+FF45; must never be NFKC-folded into the denied column `email`
  - id: uni-006
    category: unicode_identifiers
    sql: |-
      SELECT region FROM U&"\0073ales"
    expect: safe
  - id: uni-007
    category: unicode_identifiers
    sql: |-
      SELECT region FROM sales WHERE region = U&'\004E\006Frth'
    expect: safe
  - id: uni-008
    category: unicode_identifiers
    sql: |-
      SELECT U&"\+000063ost_price" FROM sales
    expect: reject
    codes: [column_not_allowed, unknown_column, parse_error]

