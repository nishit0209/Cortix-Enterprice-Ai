# SQL guard attack corpus (TESTING_STRATEGY §4.2, SECURITY_ARCHITECTURE §5.1). QA/Security-owned.
#
# Each case runs through apps.sqlguard.services.validate(sql, policy) (contract: nexora/contracts.py SqlGuard).
#   expect: reject       -> GuardResult.ok is False and reject_code is one of `codes` (codes[0] = preferred code)
#   expect: neutralized  -> ok is True and the regenerated SQL only touches permitted data (see `checks`)
#   expect: safe         -> either rejected (any code) or neutralized under the same checks
#   stage:  execute      -> only decidable at execution (EXPLAIN cost / relations); skipped by validate-only runs
# Generic invariants are applied to EVERY accepted query (see test_sql_guard_corpus.py):
#   physical tables subset of the policy tables; no denied column referenced; row-policy tables always filtered.
# `generate` builds very large inputs programmatically (deep nesting, huge IN lists, oversize text).
version: 1

policies:
  default:
    tables:
      sales: org_qatest01.ds_101_v1
      customers: org_qatest01.ds_102_v1
    allowed_columns:
      sales: [order_id, order_date, customer_id, region, product, category, quantity, unit_price, discount, revenue, channel]
      customers: [customer_id, customer_name, city, segment]
    denied_columns:   # physically present in the warehouse table but NOT granted by the policy
      sales: [cost_price, margin_secret]
      customers: [email, phone, pan_number]
  masked:
    extends: default
    allowed_columns:
      customers: [customer_id, customer_name, city, segment, phone]
    denied_columns:
      customers: [email, pan_number]
    column_masks:
      customers.phone: mask_partial
  north_only:
    extends: default
    row_predicates:
      sales: [[region, "=", North]]

categories:
  - statement_smuggling
  - dangerous_functions
  - cross_tenant_catalog
  - denied_columns
  - row_policy
  - lexical
  - dos
  - prompt_injection
  - positive_control

cases:
  # ------------------------------------------------------------------ statement smuggling
