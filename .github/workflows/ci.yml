name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.8.4 import-linter==2.1
      - run: python scripts/check_conventions.py
      - run: ruff check backend
      - name: Ownership (agent branches only)
        if: startsWith(github.ref_name, 'agent/')
        run: |
          git fetch origin main --depth=50 || true
          AGENT=$(echo "${GITHUB_REF_NAME}" | cut -d/ -f2)
          python scripts/check_ownership.py --agent "$AGENT" --base origin/main

  backend:
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      DJANGO_SETTINGS_MODULE: nexora.settings.test
      NEXORA_APP_PASSWORD: nexora_app_dev
      NEXORA_MIGRATOR_PASSWORD: nexora_migrator_dev
      NEXORA_OPS_PASSWORD: nexora_ops_dev
      WH_LOADER_PASSWORD: wh_loader_dev
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: Bootstrap Postgres roles/extensions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export POSTGRES_USER=postgres PGHOST=localhost PGPORT=5433
          sed 's/--username "\$POSTGRES_USER"/--username "$POSTGRES_USER" -h localhost -p 5433/' infra/postgres/init/00-init.sh > /tmp/init.sh
          bash /tmp/init.sh
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: lint-imports
      - working-directory: backend
        run: pytest -n 2 --create-db

  frontend:
    runs-on: ubuntu-latest
    needs: static
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt || true
